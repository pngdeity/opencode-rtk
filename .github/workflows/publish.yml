name: Publish

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: no NPM_TOKEN. Configure a trusted publisher for this
# package on npmjs.com first, or the publish step fails authentication.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Caching is never appropriate in a release build.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # prepack runs the build and the tests; running them again here would
      # execute each of them twice per release.
      - run: npm publish
